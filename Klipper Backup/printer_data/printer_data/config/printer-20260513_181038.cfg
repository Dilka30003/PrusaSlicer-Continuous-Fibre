[include fluidd.cfg]
[include toolchange.cfg]
[include print_macros.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_410014001251313531383332-if00

[force_move]
enable_force_move:true

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 1000

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -28
position_min: -28
position_max: 325
homing_speed: 80
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
run_current: 0.800
driver_SGTHRS: 120
stealthchop_threshold: 999999

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 32
endstop_pin: PG13
position_endstop: 0
position_max: 210
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD11
#diag_pin: PG9
run_current: 0.800
stealthchop_threshold: 999999

# Driver2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG12
#position_endstop: 145
position_max: 147
position_min:-5
homing_speed: 40
homing_retract_dist: 1
second_homing_speed: 5

[tmc2209 stepper_z]
uart_pin: PC6
#diag_pin: PG10
run_current: 0.650
stealthchop_threshold: 999999

[extruder]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 15.78
#full_steps_per_rotation:
# gear_ratio:
#   See the "stepper" section for a description of the above
#   parameters. If none of the above parameters are specified then no
#   stepper will be associated with the nozzle hotend (though a
#   SYNC_EXTRUDER_MOTION command may associate one at run-time).
nozzle_diameter: 0.6
filament_diameter: 1.75
pressure_advance: 0.3
heater_pin: PA3
sensor_type: PT1000
sensor_pin: PF4
control: pid
pid_Kp=18.702
pid_Ki=0.826
pid_Kd=105.899
min_extrude_temp: 0
min_temp: 0
max_temp: 310
max_extrude_cross_section: 10

[heater_fan heatbreak_0]
pin: PE5
max_power: 1
shutdown_speed: 1
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[extruder1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 15.78
#full_steps_per_rotation:
#gear_ratio:
#   See the "stepper" section for a description of the above
#   parameters. If none of the above parameters are specified then no
#   stepper will be associated with the nozzle hotend (though a
#   SYNC_EXTRUDER_MOTION command may associate one at run-time).
nozzle_diameter: 1
filament_diameter: 1.75
pressure_advance: 0.00
heater_pin: PA0
sensor_type: PT1000
sensor_pin: PF5
control: pid
pid_Kp=21.241
pid_Ki=0.782
pid_Kd=144.175
min_extrude_temp: 0
min_temp: 0
max_temp: 310
max_extrude_cross_section: 10

[heater_fan heatbreak_1]
pin: PD12
max_power: 1
shutdown_speed: 1
heater: extruder1
heater_temp: 50.0
fan_speed: 1.0

[multi_pin part_fan]
pins: PD13, PD14
#   A comma separated list of pins associated with this alias. This
#   parameter must be provided.

[fan]
pin: multi_pin:part_fan

[extruder_stepper fibre_extruder]
extruder: extruder1
#   The extruder this stepper is synchronized to. If this is set to an
#   empty string then the stepper will not be synchronized to an
#   extruder. This parameter must be provided.
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 60
#   See the "stepper" section for the definition of the above
#   parameters.

[heater_bed]
heater_pin: PB11
sensor_type: Generic 3950
sensor_pin: PF3
control: pid
pid_Kp=56.299
pid_Ki=2.145
pid_Kd=369.459
min_temp: 10
max_temp: 120
#   See the "extruder" section for a description of the above parameters.

[fan_generic exhaust]
pin: PB0

[multi_pin control_fan]
pins: PA8, PD15

[controller_fan controller_fan]
pin: multi_pin:control_fan
stepper: stepper_x

[servo cutter]
pin: PB6
#   PWM output pin controlling the servo. This parameter must be
#   provided.
maximum_servo_angle: 180
#   The maximum angle (in degrees) that this servo can be set to. The
#   default is 180 degrees.
#minimum_pulse_width: 0.001
#   The minimum pulse width time (in seconds). This should correspond
#   with an angle of 0 degrees. The default is 0.001 seconds.
#maximum_pulse_width: 0.002
#   The maximum pulse width time (in seconds). This should correspond
#   with an angle of maximum_servo_angle. The default is 0.002
#   seconds.
initial_angle: 90
#   Initial angle (in degrees) to set the servo to. The default is to
#   not send any signal at startup.
#initial_pulse_width:
#   Initial pulse width time (in seconds) to set the servo to. (This
#   is only valid if initial_angle is not set.) The default is to not
#   send any signal at startup.

