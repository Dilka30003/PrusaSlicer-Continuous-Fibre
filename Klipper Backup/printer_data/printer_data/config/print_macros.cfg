[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set EXTRUDER1_TEMP = params.EXTRUDER1_TEMP|default(220)|float %}

    M140 S{BED_TEMP}
    M104 T0 S180
    M104 T1 S180
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    # Home the printer
    G28
    G1 Y10 F8000
    G1 X316

    T0

    G1 Z10 F500
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M104 T1 S{EXTRUDER1_TEMP}
    M109 T0 S{EXTRUDER_TEMP}
    M109 T1 S{EXTRUDER1_TEMP}


    G1 X325 F8000
    G1 Y60
    G1 X270
    G1 Y0
    G1 Z0.2 F1000
    G1 X300 E20
    G1 Z1


[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G90
    G1 Z145 F8000
    # Raise nozzle by 10mm
    G1 Y10
    G1 X316
    G90
    # Disable steppers
    M84

[gcode_macro PURGE]
gcode:
    G90
    G1 Y10 F6000
    G1 X325 F6000
    M83
    G1 E40 F500
    G1 Y60 F6000

[gcode_macro SET_AUTO_LIGHTS]
# The variable below should be initialized to the startup value.  If your
# device is configured to be on at startup use "variable_value: 1"
variable_value: 1
gcode:
  {% if 'VALUE' not in params %}
    {action_raise_error("Parameter 'VALUE' missing from 'SET_AUTO_LIGHTS'")}
  {% endif %}
  {% set state = params.VALUE|int %}
  {% if state %}
    # turn the LED on
    SET_LED LED=chamber WHITE=1
  {% else %}
    # turn the LED off
    SET_LED LED=chamber WHITE=0
  {% endif %}
  # Update the state of our variable.  This will inform Moonraker that
  # the device has changed its state.
  SET_GCODE_VARIABLE MACRO=SET_AUTO_LIGHTS VARIABLE=value value={state}